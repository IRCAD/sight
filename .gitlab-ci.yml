deploy-test:windows-release:
    extends: .windows_sight_deploy_test
    needs:
        - job: build:windows-release
          artifacts: true
    variables:
        BUILD_TYPE: "Release"
        SIGHT_TEST_PACKAGES: "ON"
        SIGHT_TEST_SDK: "ON"
    rules:
        - !reference [.sight_rules, ready_merge_request]
        - !reference [.sight_rules, main_branches]

deploy:windows-release:
    extends: .windows_deploy
    needs:
        - job: build:windows-release
          artifacts: true
        - job: deploy-test:windows-release
    variables:
        APPS: "sight-"
        URL: "IRCAD%20-%20Open/"
        BUILD_DIRECTORY: "build.sight"
    rules:
        - !reference [.sight_rules, main_branches]

deploy:apps-windows-release:
    extends: .windows_deploy
    needs:
        - job: build:windows-release
          artifacts: true
        - job: deploy-test:windows-release
    variables:
        APPS: "sight_viewer,sight_calibrator"
        URL: "IRCAD%20-%20Open/"
        BUILD_DIRECTORY: "build.sight"
    rules:
