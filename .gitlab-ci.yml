stages:
    - lint
    - prebuild
    - build
    - deploy-test
    - deploy

variables:
    SIGHT_VCPKG: "free" # Necessary for the prebuild stage

include:
    - project: "sight/sight-gitlab"
      ref: "e787a62094b423edda0e56da40fc7e4afb742e55"
      file: "/.templates/deploy.yml"
    - project: "sight/sight-gitlab"
      ref: "e787a62094b423edda0e56da40fc7e4afb742e55"
      file: "/.templates/build.yml"

lint:ubuntu-26.04:
    extends: .lint
    variables:
        ENABLE_CLANG_TIDY: "ON"
        SIGHT_GIT_BRANCH: "dev"
    tags:
        - linux-power-runner

.build_linux_job:
    extends: .build_linux
    needs:
        - job: lint:ubuntu-26.04
          optional: true
    variables:
        SIGHT_BUILD_TESTS: "ON"
        SIGHT_SOURCE_DIR: "$CI_PROJECT_DIR"
        SIGHT_BUILD_DIR: "$CI_PROJECT_DIR/.build"
        SIGHT_INSTALL_PREFIX: "$CI_PROJECT_DIR/.install"
        SIGHT_BUILD_EXAMPLES: "ON"
        SIGHT_ENABLE_REALSENSE: "OFF"
        SIGHT_BUILD_MANPAGES: "ON"
        SIGHT_TEST_DATA_REF: "9c1e10531151299c370a9722a2d2b46bca1b5560"
        TESTS_TIMEOUT: 960
        SIGHT_TEST_DUMP_DIR: "${CI_PROJECT_DIR}/.build/test-dumps"
        SIGHT_TEST_LOG_FALLBACK_DIR: "none"
        SIGHT_TEST_LOG_KEEP: "1"
        ENABLE_NVJPEG2K: "OFF"
    script:
        - !reference [.build_sight_linux]
        - |
            cd "$CI_PROJECT_DIR/.build"
            if [ "$SIGHT_BUILD_PACKAGES" == "ON" ]; then
                ninja -j ${LINUX_PARALLEL_BUILDS} sight_viewer_package
                rm -rf "$SIGHT_INSTALL_PREFIX"
                ninja -j ${LINUX_PARALLEL_BUILDS} sight_calibrator_package
                rm -rf "$SIGHT_INSTALL_PREFIX"
            fi
            if [ "$SIGHT_BUILD_SDK" == "ON" ]; then
                ninja -j ${LINUX_PARALLEL_BUILDS} install
                ninja -j ${LINUX_PARALLEL_BUILDS} package
            fi

.linux_deploy_test:
    image: "${SIGHT_UBUNTU_26_IMAGE}"
    stage: deploy-test
    variables:
        BUILD_TYPE: "Debug"
        SIGHT_TEST_PACKAGES: "OFF"
        SIGHT_TEST_SDK: "OFF"
    script:
        - cd .build
        - >
            if [ "${SIGHT_TEST_PACKAGES}" == "ON" ]; then
              tar -xf packages/sight_viewer-*.tar.zst
              echo Testing sight_viewer:
              timeout 5s xvfb-run -a sight_viewer-*/bin/sight_viewer || [ $? -eq 124 ]

              tar -xf packages/sight_calibrator-*.tar.zst
              echo Testing sight_calibrator:
              timeout 5s xvfb-run -a sight_calibrator-*/bin/sight_calibrator || [ $? -eq 124 ]
            fi
        - >
            if [ "${SIGHT_TEST_SDK}" == "ON" ]; then
              tar -xf packages/sight-*.tar.zst
              for program in sight-*/bin/{ex*,tuto*,sight_viewer,sight_calibrator}; do
                  echo Testing $(basename $program):
                  timeout 5s xvfb-run -a $program || [ $? -eq 124 ]
              done
              for program in sight-*/bin/{aruco_marker,network_proxy}; do
                  echo Testing $(basename $program):
                  $program --help
              done
            fi

build:ubuntu-26.04-debug-gcc:
    extends: .build_linux_job
    variables:
        BUILD_TYPE: "Debug"
        SIGHT_BUILD_SDK: "ON"
        CC: "gcc"
        CXX: "g++"
    rules:
        - !reference [.sight_rules, ready_merge_request]
        - !reference [.sight_rules, main_branches]

build:ubuntu-26.04-release-gcc:
    extends: .build_linux_job
    variables:
        BUILD_TYPE: "Release"
        SIGHT_BUILD_SDK: "ON"
        SIGHT_BUILD_PACKAGES: "ON"
        SIGHT_IGNORE_UNSTABLE_TESTS: 1
        CC: "gcc"
        CXX: "g++"
    rules:
        - !reference [.sight_rules, ready_merge_request]
        - !reference [.sight_rules, main_branches]

build:ubuntu-26.04-RelWithDebInfo-clang:
    extends: .build_linux_job
    variables:
        BUILD_TYPE: "RelWithDebInfo"
        SIGHT_IGNORE_UNSTABLE_TESTS: 1
        SIGHT_BUILD_DOC: "ON"
        CC: "clang"
        CXX: "clang++"
    rules:
        - !reference [.sight_rules, ready_merge_request]
        - !reference [.sight_rules, main_branches]

build:ubuntu-26.04-coverage-gcc:
    extends: .build_linux_job
    variables:
        BUILD_TYPE: "RelWithDebInfo"
        ENABLE_COVERAGE: "ON"
        SIGHT_IGNORE_UNSTABLE_TESTS: 1
        CC: "gcc"
        CXX: "g++"
    rules:
        # Keep an explicit merge request rule in the project's root CI file.
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        - !reference [.sight_rules, main_branches]

# Compatibility job: Ubuntu 24.04 keeps one build until it is dropped
build:ubuntu-24.04-release-gcc:
    extends: .build_linux_job
    image: "${SIGHT_UBUNTU_24_IMAGE}"
    variables:
        BUILD_TYPE: "Release"
        SIGHT_IGNORE_UNSTABLE_TESTS: 1
        CC: "gcc"
        CXX: "g++"
    rules:
        - !reference [.sight_rules, ready_merge_request]
        - !reference [.sight_rules, main_branches]

deploy-test:linux-debug:
    extends: .linux_deploy_test
    needs:
        - job: build:ubuntu-26.04-debug-gcc
          artifacts: true
    variables:
        BUILD_TYPE: "Debug"
        SIGHT_TEST_SDK: "ON"
    rules:
        - !reference [.sight_rules, ready_merge_request]
        - !reference [.sight_rules, main_branches]

deploy:linux-debug:
    extends: .linux_deploy
    needs:
        - job: build:ubuntu-26.04-debug-gcc
          artifacts: true
        - job: deploy-test:linux-debug
    variables:
        APPS: "sight-"
        URL: "IRCAD%20-%20Open/"
    rules:
        - !reference [.sight_rules, main_branches]

deploy-test:linux-release:
    extends: .linux_deploy_test
    needs:
        - job: build:ubuntu-26.04-release-gcc
          artifacts: true
    variables:
        BUILD_TYPE: "Release"
        SIGHT_TEST_PACKAGES: "ON"
        SIGHT_TEST_SDK: "ON"
    rules:
        - !reference [.sight_rules, ready_merge_request]
        - !reference [.sight_rules, main_branches]

deploy:linux-release:
    extends: .linux_deploy
    needs:
        - job: build:ubuntu-26.04-release-gcc
          artifacts: true
        - job: deploy-test:linux-release
    variables:
        APPS: "sight-"
        URL: "IRCAD%20-%20Open/"
    rules:
        - !reference [.sight_rules, main_branches]

deploy:apps-linux-release:
    extends: .linux_deploy
    needs:
        - job: build:ubuntu-26.04-release-gcc
          artifacts: true
        - job: deploy-test:linux-release
    variables:
        APPS: "sight_viewer,sight_calibrator"
        URL: "IRCAD%20-%20Open/"
    rules:
        - !reference [.sight_rules, main_branches]

.build_windows_job:
    extends: .build_windows
    needs:
        - job: lint:ubuntu-26.04
          optional: true
        - job: prebuild:windows
    variables:
        TOOLCHAIN: "scripts\\buildsystems\\vcpkg.cmake"
        SIGHT_VCPKG: "free"
        SIGHT_SOURCE_DIR: "$CI_PROJECT_DIR"
        SIGHT_BUILD_EXAMPLES: "ON"
        SIGHT_BUILD_TESTS: "ON"
        SIGHT_BUILD_PACKAGES: "OFF"
        SIGHT_BUILD_SDK: "OFF"
        MSVC_VERSION: "17"
        CUDA_VERSION: "12_5"
        SIGHT_TEST_DATA_REF: "9c1e10531151299c370a9722a2d2b46bca1b5560"
        SIGHT_TEST_LOG_FALLBACK_DIR: "none"
        SIGHT_TEST_LOG_KEEP: "1"
        SIGHT_TEST_DUMP_DIR: "${CI_PROJECT_DIR}\\build\\test-dumps"
        ENABLE_NVJPEG2K: "OFF"
    stage: build
    script:
        - !reference [.build_sight_windows]
        - |
            cd "${env:CI_PROJECT_DIR}/build.sight"
            if ("${SIGHT_BUILD_PACKAGES}" -eq "ON") {
              ninja -j ${WINDOWS_PARALLEL_BUILDS} sight_viewer_package
              Remove-Item -Path "${env:CI_PROJECT_DIR}/install" -Force -Recurse -ErrorAction Ignore
              ninja -j ${WINDOWS_PARALLEL_BUILDS} sight_calibrator_package
              Remove-Item -Path "${env:CI_PROJECT_DIR}/install" -Force -Recurse -ErrorAction Ignore
            }
            if ("${SIGHT_BUILD_SDK}" -eq "ON") {
              ninja -j ${WINDOWS_PARALLEL_BUILDS} install
              try {
                if (Select-String -Pattern "[A-Z]:[\\/\\]\w+" -Path "${env:CI_PROJECT_DIR}/install/lib/cmake/sight/*.cmake") {
                  Write-Error "The package is not relocatable: absolute paths were found."
                  exit 1
                }
              }
              catch {
                Write-Error "Could not verify that the Sight package can be relocated: $($_.Exception.Message)"
                exit 1
              }
              ninja -j ${WINDOWS_PARALLEL_BUILDS} package
            }
    artifacts:
        when: always
        name: "${env:CI_JOB_NAME}-${env:CI_COMMIT_REF_SLUG}"
        paths:
            - build.sight/packages/*.exe
            - build.sight/packages/*.zip
            - build.sight/ctest*.log
            - build.sight/bin/test-logs/

.windows_sight_deploy_test:
    extends: .windows_deploy_test
    variables:
        BUILD_DIRECTORY: "build.sight"
    script:
        - $PACKAGE_NAME = cmd /c cmake -DGET_ARCHIVE_FOLDER=ON -P "${env:CI_PROJECT_DIR}\cmake\build\download_deps.cmake" '2>&1'
        - cd "${env:BUILD_DIRECTORY}"
        - |
            if("${SIGHT_TEST_PACKAGES}" -eq "ON"){
              Start-Process -Wait .\packages\sight_viewer-*.exe /S,/D=${pwd}\sight_viewer
              Start-SightProcess -path "sight_viewer\bin\sight_viewer.bat"

              Start-Process -Wait .\packages\sight_calibrator-*.exe /S,/D=${pwd}\sight_calibrator
              Start-SightProcess -path "sight_calibrator\bin\sight_calibrator.bat"
            }
        - |
            Expand-Archive packages/sight-*.zip
            if("${SIGHT_TEST_SDK}" -eq "ON"){
              if ( ${BUILD_TYPE} -eq "Debug" ) {
                $env:PATH = "$CACHE\$PACKAGE_NAME\installed\x64-windows\debug\bin;$env:PATH"
              }
              else {
                $env:PATH = "$CACHE\$PACKAGE_NAME\installed\x64-windows\bin\;$env:PATH"
              }
              cd sight-*/*/bin
              ForEach($program in Get-ChildItem ex*.bat,tuto*.bat,sight_viewer.bat,sight_calibrator.bat){
                $programName = Split-Path -Leaf $program
                Write-Host Testing $programName
                Start-SightProcess -path $program
              }
              ForEach($program in Get-ChildItem aruco_marker.exe){
                $programName = Split-Path -Leaf $program
                Write-Host Testing $programName
                Start-Process -NoNewWindow -Wait $program --help
              }
            }

build:windows-debug:
    extends: .build_windows_job
    variables:
        BUILD_TYPE: "Debug"
        SIGHT_BUILD_SDK: "ON"
    rules:
        - !reference [.sight_rules, ready_merge_request]
        - !reference [.sight_rules, main_branches]

build:windows-release:
